<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كلية شرق النيل | نظام الامتحانات الذكية</title>
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#1e3a8a', secondary: '#3b82f6' }, fontFamily: { sans: ['Cairo', 'sans-serif'] } } }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f1f5f9; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .camera-preview { position: fixed; bottom: 20px; left: 20px; width: 160px; height: 120px; background: #000; border: 3px solid #1e3a8a; border-radius: 12px; object-fit: cover; z-index: 9999; transform: scaleX(-1); box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .hidden { display: none !important; }
        .dark-mode { background-color: #1e293b !important; color: #f8fafc !important; }
        .dark-mode .bg-white { background-color: #334155 !important; color: #f8fafc !important; border-color: #475569 !important; }
        .dark-mode .text-gray-800, .dark-mode .text-gray-700, .dark-mode .text-gray-600 { color: #f8fafc !important; }
        .dark-mode .bg-gray-100 { background-color: #0f172a !important; }
        .dark-mode .border-gray-200 { border-color: #475569 !important; }
        .dark-mode .hover\:bg-blue-50:hover { background-color: #1e3a8a !important; }
    </style>
</head>
<body class="text-gray-800">
    <div id="app"></div>
    <div id="connection-status" class="hidden fixed bottom-4 right-4 z-[10000] rounded-xl px-4 py-3 text-sm font-bold shadow-lg"></div>
    <video id="cam-feed" class="camera-preview hidden" autoplay muted></video>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
    </script>
</body>
</html>
